services:

  # 预览引擎本体
  fileview:
    # ⚠️ 锁到 digest（= 1.5.2 的镜像摘要），不要只写标签。
    # 标签是**可移动的**：上游重新推同一个 1.5.2 时内容可能变，而镜像版本没变就等于
    # 「本地拉到了别的东西，行为/漏洞面都不一样了」。锁 digest 后 docker 只认这一份内容，
    # 完全可复现；将来要升级就同时改标签和 digest（查：docker buildx imagetools inspect）。
    image: basemetas/fileview:1.5.2@sha256:ebcb1dc6d5fb90774db1867bdc0f8b952a0795c3d9e7b6550a6c31d8599f79ad
    container_name: basemetas-fileview-engine
    restart: unless-stopped
    volumes:
      # 下面两行由安装向导按你填写的存储卷自动重建，请勿删除 BEGIN / END 标记行
      # ## VOLUMES_BEGIN
      - /vol1:/vol1:ro
      - /vol2:/vol2:ro
      # ## VOLUMES_END
      # 自定义字体目录：镜像只内置免费的中文思源字体 + 部分英文字体，不含仿宋/宋体/黑体等
      # 需授权的字体。挂到应用的**数据目录**下（@appdata），卸载重装、升级都不会丢；
      # 放入 ttf / ttc / otf 后重启本容器即可生效，见 README「装中文字体」一节。
      - "${TRIM_PKGVAR}/fonts:/usr/local/share/fonts:ro"
      # 引擎的工作目录与日志，必须挂出来：
      #   /opt/fileview/data  —— 转换产物、解压临时文件、LibreOffice / CAD 的工作目录
      #                          （preview-dir / temp-dir / uncompress-dir / libreoffice / cad2x / target）
      #   /opt/fileview/logs  —— preview 与 convert 两个服务的文件日志
      # 不挂的话它们会落在**容器可写层**：升级时 --force-recreate 一重建就全丢（缓存、
      # 中间产物都要重来），日志也只能从 stdout 看，而且这部分占用既不可见也不受管理。
      - "${TRIM_PKGVAR}/data:/opt/fileview/data"
      - "${TRIM_PKGVAR}/logs:/opt/fileview/logs"
    environment:
      - TZ=Asia/Shanghai
      # 网络文件预览（?url= / netFile）的白名单。引擎源码里未配置该值时**默认允许所有域名**
      # （HttpUtils: `if (!hasTrustedSitesConfig()) return true;`），而本应用的入口只做
      # **本地路径预览**（srcRelativePath），完全用不到网络下载能力。
      # 留着它就等于开了一个 SSRF：任何能登录飞牛的人都可以构造
      #   /app/basemetas-fileview/preview/view?url=http://<内网地址>/...
      # 让引擎去抓内网资源渲染给他看 —— 而且这条路径**绕过逐用户权限闸门**
      # （闸门从 path/filePath 或来源页 query 取路径，url= 请求里没有 /vol 路径，走「放行」分支）。
      # 这里配一个永不匹配的域名，等价于全禁。欢迎页的「查看样例」用的是容器内路径
      # /opt/fileview/assets/sample.docx，不受影响。
      - FILEVIEW_NETWORK_SECURITY_TRUSTED_SITES=none.invalid
      # 单文件预览大小上限（MB）。引擎自带默认值 100，超过它的文件在**转换之前**就被
      # 直接拒绝，接口返回 HTTP 413，前端显示成「文件转换失败 413」。
      #
      # 用环境变量覆盖：StorageConfig 是 @ConfigurationProperties(prefix="fileview.preview.storage")，
      # Spring Boot 里环境变量优先级高于包内 application.yml，也不用去猜镜像里配置文件的
      # 位置（挂错路径会被 docker 建成空目录，反而让容器起不来）。
      # 变量名按 Spring Boot 规则换算：点→下划线、去掉连字符、转大写。
      #
      # 下面一行由安装向导按你填写的数值自动重建，请勿删除 BEGIN / END 标记行
      # ## MAXSIZE_BEGIN
      - FILEVIEW_PREVIEW_STORAGE_MAXFILESIZEMB=1024
      # ## MAXSIZE_END

  # 统一网关适配层：监听 Unix Socket，转发给 FileView
  gateway:
    # 锁到 digest，理由同引擎镜像（标签可移动，上游重推同名 tag 内容会变）。
    # ⚠️ 代价：锁了就不会自动拿到基础镜像的安全更新 —— 需要升级时手动改这一行的 digest。
    #    查当前 digest：docker buildx imagetools inspect library/nginx:alpine
    #    2026-09-26 的 nginx:alpine（多架构清单，含 amd64 / arm64）
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    container_name: basemetas-fileview-gateway
    restart: unless-stopped
    # ⚠️ 必须先删掉残留的 app.sock 再启动。
    # /app/target 是宿主机目录的 bind 挂载，socket 文件会跨容器重启一直残留；而 nginx
    # 启动时不会自己清理已存在的 unix socket，一旦残留就 bind() failed (98: Address
    # already in use) 并退出，配合 restart: unless-stopped 变成无限重启。
    # umask 000 让新建的 socket 可被飞牛网关进程连接。
    command: ["sh", "-c", "mkdir -p /app/target && rm -f /app/target/app.sock && umask 000 && exec nginx -g 'daemon off;'"]
    depends_on:
      - fileview
    volumes:
      # ⚠️ 挂**整个 docker 目录**，不要挂单个 nginx.conf 文件：
      # 文件级挂载时，只要宿主上那个文件不存在，Docker 会自动把它建成一个空目录，
      # 挂到 nginx 的 default.conf（是个文件）上就会报
      # `not a directory: Are you trying to mount a directory onto a file`，容器起不来。
      # 目录级挂载下即使文件缺失也只是少一份配置。nginx 会自动加载 conf.d/*.conf。
      - "${TRIM_APPDEST}/docker:/etc/nginx/conf.d:ro"
      - "${TRIM_APPDEST}:/app/target:rw"
    environment:
      - TZ=Asia/Shanghai

  # 逐用户权限闸门：nginx 用 auth_request 把每个预览请求交给它判定
  #   见 app/docker/fv-acl-gate.py 头部注释。
  #
  # ⚠️ 以 root 运行是必须的：判定要 setuid 到目标用户（并按 /etc/group 设好附加组），
  #    否则「按用户组授权」的团队文件会被误判成不可读。
  #    它不碰 docker、不写任何文件，只做「以某用户身份问一句能不能读」。
  #
  # 开关：${TRIM_PKGVAR}/acl.conf 里的 mode=log（只记录）/ enforce（真正拦截，默认）。
  #       闸门每次请求现读该文件，改完立即生效，不用重启容器。
  acl:
    # 锁到 digest，理由同引擎镜像。闸门脚本只用 Python 标准库（os / sys / pwd / grp），
    # 不装任何 pip 包，所以冻结 Python 版本没有副作用。
    # ⚠️ 代价：锁了就不会自动拿到基础镜像的安全更新 —— 需要升级时手动改这一行的 digest。
    #    查当前 digest：docker buildx imagetools inspect library/python:3-alpine
    #    2026-10-04 的 python:3-alpine（多架构清单，含 amd64 / arm64）
    image: python:3-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
    container_name: basemetas-fileview-acl
    restart: unless-stopped
    depends_on:
      - fileview
    volumes:
      # 宿主真实用户表：用来算目标用户的 主组 + 附加组
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      # 闸门脚本（只读）与模式开关所在目录（只读）
      - "${TRIM_APPDEST}/docker:/acl:ro"
      - "${TRIM_PKGVAR}:/acl-conf:ro"
      # 与引擎**完全相同**的只读存储卷：判定必须在同一份文件系统视图上做。
      # 下面几行由安装向导按你填写的存储卷自动重建，请勿删除 BEGIN / END 标记行
      # ## VOLUMES_ACL_BEGIN
      - /vol1:/vol1:ro
      - /vol2:/vol2:ro
      # ## VOLUMES_ACL_END
    environment:
      - TZ=Asia/Shanghai
      - FV_ACL_MODE_FILE=/acl-conf/acl.conf
    command: ["python3", "/acl/fv-acl-gate.py"]
