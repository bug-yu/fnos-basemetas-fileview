services:

  # 预览引擎本体
  fileview:
    image: basemetas/fileview:1.5.2
    container_name: basemetas-fileview-engine
    restart: unless-stopped
    volumes:
      # 下面两行由安装向导按你填写的存储卷自动重建，请勿删除 BEGIN / END 标记行
      # ## VOLUMES_BEGIN
      - /vol1:/vol1:ro
      - /vol2:/vol2:ro
      # ## VOLUMES_END
      # 自定义字体目录（官方机制）：
      #   镜像只内置了免费的中文思源字体 + 部分英文字体，不含仿宋/宋体/黑体等需授权的字体，
      #   所以部分文档预览时字体与原稿不一致。
      #   官方做法就是把宿主目录挂到容器的 /usr/local/share/fonts。
      #   这里挂在应用的**数据目录**下（@appdata），卸载重装、升级都不会丢。
      #   放入 ttf / ttc / otf 后重启本容器即可生效，见 README「装中文字体」一节。
      - "${TRIM_PKGVAR}/fonts:/usr/local/share/fonts:ro"
    environment:
      - TZ=Asia/Shanghai

  # 统一网关适配层：监听 Unix Socket，转发给 FileView
  gateway:
    image: nginx:alpine
    container_name: basemetas-fileview-gateway
    restart: unless-stopped
    # ⚠️ 启动前必须先删掉残留的 app.sock（2026-09-26 踩坑，网关 Restarting 崩溃循环的真因）
    #
    # /app/target 是**宿主机目录的 bind 挂载**，所以 app.sock 会跨容器重启一直残留。
    # nginx 启动时不会自己清理已存在的 unix socket 文件，一旦残留就：
    #     nginx: [emerg] bind() to unix:/app/target/app.sock failed (98: Address already in use)
    # 然后进程退出 → 配合 restart: unless-stopped → 陷入 Restarting(1)、Restarting(2)…… 死循环，
    # 表现就是「引擎容器是 Up 的，但整个预览打不开」。
    #
    # 所以这里显式 rm -f 再启动。umask 000 让新建的 socket 可被飞牛网关进程连接。
    command: ["sh", "-c", "mkdir -p /app/target && rm -f /app/target/app.sock && umask 000 && exec nginx -g 'daemon off;'"]
    depends_on:
      - fileview
    volumes:
      # ⚠️ 这里挂的是**整个 docker 目录**，而不是单个 nginx.conf 文件。
      # 原因（2026-09-26 踩坑）：文件级挂载时，只要宿主上那个文件不存在，
      # Docker 会自动把它建成一个**空目录**，然后挂到 nginx 的 default.conf（是个文件）上，
      # 直接报 `not a directory: Are you trying to mount a directory onto a file`，
      # 容器起不来。改成目录级挂载后，即使文件缺失也只是 nginx 少一份配置，不会挂载失败。
      # nginx 会自动加载 conf.d/*.conf —— 我们的配置文件名是 nginx.conf，正好被加载。
      - "${TRIM_APPDEST}/docker:/etc/nginx/conf.d:ro"
      - "${TRIM_APPDEST}:/app/target:rw"
    environment:
      - TZ=Asia/Shanghai

  # 逐用户权限闸门：nginx 用 auth_request 把每个预览请求交给它判定
  #   见 app/docker/fv-acl-gate.py 头部注释。
  #
  # ⚠️ 以 root 运行是**必须的**：判定要 setuid 到目标用户（并按 /etc/group 设好附加组），
  #    否则团队文件那种「按用户组授权」的场景会被误判成不可读。
  #    它不碰 docker、不写任何文件，只做「以某用户身份问一句能不能读」。
  #
  # 开关：${TRIM_PKGVAR}/acl.conf 里的 mode=log（默认，只记录）/ enforce（真正拦截）。
  #       闸门每次请求现读该文件，改完立即生效，不用重启容器。
  acl:
    image: python:3-alpine
    container_name: basemetas-fileview-acl
    restart: unless-stopped
    depends_on:
      - fileview
    volumes:
      # 宿主真实用户表：用来算目标用户的 主组 + 附加组
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      # 闸门脚本（只读）与模式开关所在目录（只读）
      - "${TRIM_APPDEST}/docker:/acl:ro"
      - "${TRIM_PKGVAR}:/acl-conf:ro"
      # 与引擎**完全相同**的只读存储卷：判定必须在同一份文件系统视图上做。
      # 下面几行由安装向导按你填写的存储卷自动重建，请勿删除 BEGIN / END 标记行
      # ## VOLUMES_ACL_BEGIN
      - /vol1:/vol1:ro
      - /vol2:/vol2:ro
      # ## VOLUMES_ACL_END
    environment:
      - TZ=Asia/Shanghai
      - FV_ACL_MODE_FILE=/acl-conf/acl.conf
    command: ["python3", "/acl/fv-acl-gate.py"]
