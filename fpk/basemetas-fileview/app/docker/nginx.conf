# 飞牛统一网关 → FileView 的适配层
#
# 1. 监听 ${TRIM_APPDEST}/app.sock，接收飞牛统一网关校验登录态后转发的请求
# 2. 剥掉 /app/basemetas-fileview 前缀，转发给 FileView
# 3. 推导外部访问地址并写进 Host 头（FileView 靠它拼绝对预览地址）
#
# ⚠️ 为什么要自己推导：统一网关走 unix socket 转发，**不带外部端口**，
#    而 FileView 用请求的 Host 头拼绝对地址（它不读 X-Forwarded-Host/Port，
#    只额外读 X-Forwarded-Prefix 和 X-Forwarded-Proto）。端口一丢，
#    生成出来的地址就少了 :8443/:5666，浏览器按 80/443 请求打不到 NAS，
#    表现为「页面能开、欢迎页正常，但每个文件都预览失败」。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------- 推导外部访问地址 ----------------
#
# 端口来源优先级（越高越可信）：
#   1. 网关透传的 X-Forwarded-Host 里带的端口
#   2. 请求 Host 头里的端口
#   3. Referer 里的端口 —— 但**必须与本次请求同源**（见下面的同源检查）
#   4. 都拿不到就「不加端口」，让浏览器走协议默认端口（80/443）
#
# ⚠️ 第 3 条必须加同源检查：飞牛「自定义 URL」在非局域网模式下会用外部地址打开
#    应用，而这个跳转的 Referer 可能来自之前用**内网地址**打开的页面。于是主机名
#    取自 Host（外部域名）、端口取自 Referer（内网端口），拼出一个根本不存在的地址。
#    所以端口与主机名必须来自同一个来源。

# 主机名：优先用网关透传的，其次用本请求 Host，最后去掉可能带的端口
map $http_x_forwarded_host $ext_hostname {
    default          $http_x_forwarded_host;
    ""               $host;
    "~^([^:]+):\d+$" $1;
}

map $http_x_forwarded_host $port_from_xh {
    default          "";
    "~^[^:]+:(\d+)$" $1;
}
map $http_host $port_from_host {
    default          "";
    "~^[^:]+:(\d+)$" $1;
}

# --- Referer：先取出端口和主机名，再判断是否与本次请求同源 ---
map $http_referer $port_from_ref_raw {
    default                   "";
    "~^https?://[^/]+:(\d+)/" $1;
}
map $http_referer $ref_host {
    default               "";
    "~^https?://([^/:]+)" $1;
}
# Referer 主机名 == 本请求主机名 → 1（同源），否则 0
# 键用逗号拼接，逗号在正则里不是元字符，避免额外的转义风险
map "$ref_host,$ext_hostname" $referer_same_host {
    default    0;
    "~^(.+),\1$" 1;
}
# 只有同源的 Referer 端口才采信
map "$port_from_ref_raw,$referer_same_host" $port_from_ref {
    default      "";
    "~^(\d+),1$" $port_from_ref_raw;
}

map "$port_from_xh:$port_from_host:$port_from_ref" $ext_port {
    default    "";
    "~^\d+:"   $port_from_xh;
    "~^:\d+:"  $port_from_host;
    "~^::\d+$" $port_from_ref;
}

# Host 头取值：有端口就带上，没端口就不带（不能写成 "host:" 带个空尾巴）
map $ext_port $ext_authority {
    default "$ext_hostname:$ext_port";
    ""      "$ext_hostname";
}

# 协议：优先用网关透传的，其次看 Referer
map $http_referer $proto_from_ref {
    default      "http";
    "~^https://" "https";
}
map $http_x_forwarded_proto $ext_proto {
    default $http_x_forwarded_proto;
    ""      $proto_from_ref;
}

# 诊断日志：docker logs basemetas-fileview-gateway 可看到推导结果。
# ref_host / same 两列用来判断 Referer 是不是被同源检查挡掉了；
# uid / isadmin 两列用来确认统一网关有没有把身份头传进来。
log_format fvdiag 'diag uid=$http_x_trim_userid isadmin=$http_x_trim_isadmin in_host=$http_host ref_host=$ref_host same=$referer_same_host out_host=$ext_authority proto=$ext_proto uri=$request_uri';
access_log /var/log/nginx/access.log fvdiag;

#
# ============ 可选：固定兜底端口（默认关闭，按需启用）============
#
# 场景：首次导航既无 Referer、Host 与 X-Forwarded-Host 也都不带端口时，会推导成
#       「不加端口」（走 443/80）。若你的外部访问端口不是 443，这一次导航的地址就会偏。
#
# 代价：兜底值写死，以后换外部端口要回来同步改这一行；若你真的用标准端口 443
#       从域名访问，会被错误地加上 :8443。纯内网访问不受影响。
#
# 启用方法：去掉下面 4 段的注释，并把 8443 改成你的外部端口。
#
# map $ext_hostname $is_lan_host {
#     default                                                    0;
#     "~^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|127\.)"      1;
# }
# map "$ext_port,$is_lan_host" $ext_port_final {
#     default  "$ext_port";
#     ",0"     "8443";
# }
# （启用后，把上面 `map $ext_port $ext_authority` 的键改成 $ext_port_final）
#

# ============================================================================
# 应用中心点「打开」→ 欢迎页
# ============================================================================
# 飞牛应用中心卡片上的「打开」按钮走的是 desktop_applaunchname 指定的入口，
# 也就是 /preview/view —— 但它**不带 ?path=**（`?path=<绝对路径>` 是文件管理器
# 右键「用 FileView 打开」时才追加的）。SPA 拿不到文件路径就什么都不渲染，
# 结果是一片空白页，看起来像部署失败了。
#
# 这里把「URI 正好是 /preview/view 且 path 为空」的请求转到欢迎页 ——
# 应用中心点「打开」能看到支持格式列表（顺带当部署自检），
# 而真正带 path 的文件预览完全不受影响。
#
# 键用 "$uri:$arg_path"：只有 path 为空时才会拼出「以冒号结尾」的串。
# 用 `~`（区分大小写）而不是 `~*`，宁可漏转也不要误伤正常的预览请求。
map "$uri:$arg_path" $fv_view_needs_welcome {
    default 0;
    "~^/app/basemetas-fileview/preview/view:$" 1;
}

# ============================================================================
# 逐用户权限闸门
# ============================================================================
# nginx 用 auth_request 把每个 /app/basemetas-fileview/ 请求交给闸门容器判定：
#   闸门按统一网关注入的 X-Trim-Userid，**以那个用户的身份**检查目标路径能否读
#   （见 app/docker/fv-acl-gate.py），不可读则 403；其余情况一律放行。
#
# ★ 兜底（fail-open）：闸门容器不可用时绝不能把整个应用拖死。
#   做法是给 upstream 挂一个永远连不上的备用 + 本机回环上的「永远 200」服务：
#   闸门连不上时 nginx 自动 failover 到回环服务 → 放行。
#   最坏情况只是「没保护」，不会出现「应用打不开」。
upstream aclgate {
    server basemetas-fileview-acl:8080 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:18081 backup;
}

# ★ body 代理用的 upstream：**故意不带**回环兜底。
#   这里的 fail-open 不能用「回环永远 200」实现 —— 那是给 auth_request（只看状态码）用的；
#   而 body 代理需要闸门**真的把请求转发给引擎**，回环服务做不到。
#   所以改用 error_page → @fv_guard_direct 直连引擎实现 fail-open（见下面）。
upstream aclbody {
    server basemetas-fileview-acl:8080 max_fails=1 fail_timeout=10s;
}

# 回环兜底服务：只监听 127.0.0.1，容器外访问不到，仅供上面的 failover 使用。
server {
    listen 127.0.0.1:18081;
    server_name _;
    location /check {
        return 200;
    }
}

server {
    listen unix:/app/target/app.sock;
    server_name _;

    autoindex off;

    # ★★ 让 nginx 发「相对」的 Location，别发绝对地址 —— 默认值会丢端口。
    #
    # nginx 的 absolute_redirect 默认是 on：return/rewrite 发出的重定向会被拼成
    # 绝对地址，用的是 $scheme + $host(+端口)。而本 server 监听的是 **unix socket**
    # （没有端口），$host 又来自 Host 头 —— 飞牛统一网关经 socket 转发时**会把外部
    # 端口从 Host 里去掉**。两个因素叠加，Location 只能写成
    # `http://<域名>/...`（无端口），浏览器按 80/443 去请求就打不到 NAS。
    #
    # 实测（外部访问在 :8443）：应用中心点「打开」时
    #   https://<域名>:8443/app/basemetas-fileview/preview/view
    #     → 302 到 https://<域名>/app/basemetas-fileview/preview/welcome   ← :8443 没了
    # （http 被浏览器 HSTS 升级成 https，端口却是真的丢了。）
    #
    # 改成 off 后 Location 是相对的（/app/basemetas-fileview/...），
    # 浏览器用自己的 origin 解析，scheme / 域名 / **端口**都自然保留。
    absolute_redirect off;

    # 网关前缀根路径 → FileView 欢迎页（子目录部署下欢迎页在 /preview/welcome）
    location = /app/basemetas-fileview {
        return 302 /app/basemetas-fileview/preview/welcome;
    }

    location = /app/basemetas-fileview/ {
        return 302 /app/basemetas-fileview/preview/welcome;
    }

    # ── 诊断端点：回显统一网关转发过来的身份头 ──────────────────────────
    #   curl -i "https://<你的域名>/app/basemetas-fileview/__whoami"
    # 只回显请求头本身，不含任何文件内容；且必须先通过统一网关的登录态校验
    # 才能到达这里（本容器只监听 app.sock，不对外暴露端口）。
    # 放在 catch-all 的 location 之前，用 = 精确匹配拿到最高优先级。
    location = /app/basemetas-fileview/__whoami {
        default_type text/plain;
        add_header X-Trim-Userid-Seen  "$http_x_trim_userid"  always;
        add_header X-Trim-Username-Seen "$http_x_trim_username" always;
        add_header X-Trim-Isadmin-Seen "$http_x_trim_isadmin" always;
        return 200 "uid=$http_x_trim_userid | user=$http_x_trim_username | isadmin=$http_x_trim_isadmin | remote=$remote_addr";
    }

    # FileView 子目录部署：proxy_pass 结尾带 /，剥掉前缀
    location /app/basemetas-fileview/ {
        # 按用户校验目标路径的读权限；闸门不可用时自动放行（见上面的 aclgate upstream）
        auth_request /__acl;

        proxy_pass http://fileview:80/;

        proxy_http_version 1.1;

        # ★★★ 核心一行：FileView 拼「绝对预览地址」用的是请求的 Host 头。
        #     飞牛网关转发的 Host 不带端口，必须在这里补上。
        proxy_set_header Host $ext_authority;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 这两个 FileView 会读
        proxy_set_header X-Forwarded-Proto $ext_proto;
        proxy_set_header X-Forwarded-Prefix /app/basemetas-fileview;

        # 这个 FileView 目前不读，但换应用时可能用得上，顺手给上
        proxy_set_header X-Forwarded-Host $ext_authority;
        proxy_set_header X-Forwarded-Port $ext_port;

        # 大图纸 / 大 PDF 转换耗时较长，放宽超时并关闭缓冲
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 2048m;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 闸门的内部调用入口（auth_request 的子请求打到这里，外部访问不到）
    location = /__acl {
        internal;
        proxy_pass http://aclgate/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;

        # 身份头：统一网关注入（uid=1000 / user=<用户名> / isadmin=true）
        proxy_set_header X-Acl-Uid  $http_x_trim_userid;

        # 目标路径给三种来源，闸门按优先级取（$arg_* 在子请求里不一定可用，所以有冗余）
        proxy_set_header X-Acl-Path $arg_path;
        proxy_set_header X-Acl-File $arg_filePath;

        # 原始 URI 与来源页。
        # POST /preview/api/localFile 只在**请求体**里带路径，nginx 看不到 body，
        # 只能靠来源页 URL 里的 path 推断 —— 闸门会解析这两个头。
        proxy_set_header X-Acl-Uri  $request_uri;
        proxy_set_header X-Acl-Ref  $http_referer;
    }

    # ==========================================================================
    # ★ 路径只在**请求体**里的接口 —— 交给闸门「读 body → 判 ACL → 再转发」
    # ==========================================================================
    #
    # 为什么不能继续用 auth_request：
    #   auth_request 在 ACCESS 阶段执行，**请求体还没被读**，闸门物理上看不到 body
    #   （location = /__acl 里写着 proxy_pass_request_body off）。对这类接口，
    #   闸门只能退回用来源页（Referer）的 path 判定，而攻击者可以：
    #     ① 先打开一个**自己有权读**的文件 → 拿到合法 Referer；
    #     ② 再 POST，body 里换成别人的路径。
    #   → 闸门拿合法 Referer 判定并放行，body 里的非法路径**根本没被看过**。
    #   （真机已复现：无 Referer = 200，带合法 Referer = 200。）
    #
    # 现在的做法：把**整个请求**交给闸门。闸门读 body 取出真实路径、按 uid 判 ACL，
    #   通过后由**闸门自己**转发给引擎 —— 于是「判定的路径」与「引擎实际读的路径」
    #   必然是同一个值，不存在"看得见一份、读的是另一份"的空隙。
    #
    # ⚠️⚠️ 必须用 `location =`（**精确匹配**），不能用 `location ~`（regex）——
    #   nginx 明确禁止在 regex / 命名 / if / limit_except 里给 proxy_pass 带 URI 部分：
    #     "proxy_pass" cannot have URI part in location given by regular expression, ...
    #   而这里需要把 URI 改写成 /guard 交给闸门，所以只能用精确匹配。
    #   精确匹配的优先级本来就高于任何 regex（含下面那条 SPA regex），
    #   所以也顺带避开了「regex 顺序」这个坑 —— 不必再关心谁写在前面。
    #
    # 接口清单在闸门侧（fv-acl-gate.py 的 BODY_PATH_FIELDS），这里只负责路由。
    # 开关：${TRIM_PKGVAR}/acl.conf 里的 body_guard=enforce（默认）/ log（只记录，仍转发）。
    location = /app/basemetas-fileview/preview/api/localFile {
        proxy_pass http://aclbody/guard;

        proxy_http_version 1.1;
        proxy_set_header Host $ext_authority;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ext_proto;
        proxy_set_header X-Forwarded-Prefix /app/basemetas-fileview;
        # ⚠️ 这几个必须给：闸门转发时会把它们带给引擎，
        #    引擎按它们推导 baseUrl（少了会拼出 http://fileview 这种浏览器打不开的地址）
        proxy_set_header X-Forwarded-Host $ext_authority;
        proxy_set_header X-Forwarded-Port $ext_port;

        # 身份头与原始 URI（闸门靠 X-Acl-Uri 判断这是哪个接口）
        proxy_set_header X-Acl-Uid  $http_x_trim_userid;
        proxy_set_header X-Acl-Uri  $request_uri;
        proxy_set_header X-Acl-Ref  $http_referer;

        # 请求体必须原样转给闸门（默认就是 on，显式写出以免以后被误改）
        proxy_pass_request_body on;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        # ★ fail-open：闸门不可用（502/503/504）时直连引擎放行。
        #   与全站取向一致 —— 最坏情况是"没保护"，不会变成"应用打不开"。
        #   ⚠️ 必须配 proxy_intercept_errors on：否则**上游（闸门）返回的** 502
        #      会被直接透传给客户端，error_page 根本不触发。
        proxy_intercept_errors on;
        error_page 502 503 504 = @fv_guard_direct;
    }

    # password/unlock 同样把路径放在请求体里（originalFilePath），且引擎侧**无任何校验**
    # —— 可用来探测文件是否存在并爆破密码（执行 7zz -p<pwd>）。
    # 这里**不封禁而是走闸门**：加密压缩包的正常解锁流程照旧可用，
    # 但路径必须先过逐用户 ACL 判定，探测别人文件这条路被堵上。
    location = /app/basemetas-fileview/preview/api/password/unlock {
        proxy_pass http://aclbody/guard;

        proxy_http_version 1.1;
        proxy_set_header Host $ext_authority;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ext_proto;
        proxy_set_header X-Forwarded-Prefix /app/basemetas-fileview;
        # ⚠️ 这几个必须给：闸门转发时会把它们带给引擎，
        #    引擎按它们推导 baseUrl（少了会拼出 http://fileview 这种浏览器打不开的地址）
        proxy_set_header X-Forwarded-Host $ext_authority;
        proxy_set_header X-Forwarded-Port $ext_port;

        proxy_set_header X-Acl-Uid  $http_x_trim_userid;
        proxy_set_header X-Acl-Uri  $request_uri;
        proxy_set_header X-Acl-Ref  $http_referer;

        proxy_pass_request_body on;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        proxy_intercept_errors on;
        error_page 502 503 504 = @fv_guard_direct;
    }

    # 上面两条的 fail-open 落点：绕过闸门，直接转发给引擎。
    # ⚠️ 命名 location 同样**不允许** proxy_pass 带 URI 部分，
    #   所以这里用项目里已验证可行的写法：rewrite … break + 不带 URI 的 proxy_pass。
    #   （SPA location 与 .js location 用的就是这个惯用法，真机长期在用。）
    location @fv_guard_direct {
        rewrite ^/app/basemetas-fileview/(.*)$ /$1 break;
        proxy_pass http://fileview:80;

        proxy_http_version 1.1;
        proxy_set_header Host $ext_authority;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ext_proto;
        proxy_set_header X-Forwarded-Prefix /app/basemetas-fileview;
        # ⚠️ 这几个必须给：闸门转发时会把它们带给引擎，
        #    引擎按它们推导 baseUrl（少了会拼出 http://fileview 这种浏览器打不开的地址）
        proxy_set_header X-Forwarded-Host $ext_authority;
        proxy_set_header X-Forwarded-Port $ext_port;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ==========================================================================
    # 直接封掉一个**本应用用不到**的高危接口
    # ==========================================================================
    #
    # POST /convert/api/srvFile —— 引擎侧是「以 root 读源文件 → 转换 → 写 targetPath」，
    # 没有任何根目录收敛（见引擎源码 BaseConvertController / ValidateAndNormalized）。
    # 本应用只做本地路径预览，不需要它；真机实测该前缀本就 404（未暴露），
    # 这里显式封掉，防止上游改动或路由变化把它暴露出来。
    location = /app/basemetas-fileview/convert/api/srvFile {
        return 403;
    }

    # ============ Excel / CSV 兜底：改写前端唯一一处 credentials:'omit' ============
    #
    # FileView 前端取文件字节时，只有 Excel/CSV 这个渲染器写了
    #     fetch(url, { credentials: 'omit' })
    # （源码 src/components/render/cell/index.tsx，全仓库仅此一处；其余渲染器都不带该选项）。
    # 在统一网关模式下文件请求靠登录会话（Cookie）鉴权，凭据一被 omit 就取不到文件，
    # 而该渲染器没有 error 回调，加载遮罩永远不隐藏 → 界面无限转圈且无提示。
    # 这里把它改回浏览器默认的同源行为（带上 Cookie）。
    #
    # 为什么单独一个 location：sub_filter 只能改未压缩内容（要向上游声明
    # Accept-Encoding 为空）且需要响应经过缓冲，而主 location 为流式传大文件
    # 关掉了缓冲，两者不能共存，所以只对 .js 放开缓冲。
    # 代价：前端 JS 以未压缩形式传输（首屏多几百 KB）。上游修好后可整段删掉。
    #
    # ⚠️ 依赖 nginx 的 sub 模块（官方 nginx:alpine 镜像已内置）。应用前可先自查：
    #    docker exec basemetas-fileview-gateway nginx -V 2>&1 | grep -o with-http_sub_module
    # ============ 浏览器端运行时补丁（两个「功能缺失」） ============
    #
    # ① PDF 没有工具栏（触屏电脑被误判成 iPad）—— 内联在本 location 的 sub_filter 里
    # ② Excel 没有缩放控件 —— 外链 app/docker/fv-web-patch.js（逻辑长，单独放便于维护）
    #
    # ── ① 的现象与根因 ───────────────────────────────────────────────────
    # 现象：PDF 预览没有工具栏，不能旋转 / 双页 / 全屏 / 搜索，也没有浮动缩放。
    #
    # 根因（上游前端 utils/device.ts）：
    #   isPadFun() 的最后一行兜底是「屏幕短边 >= 600 就算 Pad」。于是**带触摸的电脑**
    #   （触屏笔记本、接了触屏显示器的台式机）——maxTouchPoints > 1、主指针不是 coarse
    #   ——会一路走到那行，被判定成 iPad → isMobile = true。
    #   而 PDF 工具栏的每个按钮（旋转/双页/全屏/打印/搜索）和浮动缩放控件都写着
    #   `!isMobile`，于是被一起隐藏。用户实测：debug 页显示 isPad=true / isMobile=true。
    #
    # 修法：把 navigator.maxTouchPoints 归零 ——
    #   isPhoneFun() 有 `maxTouchPoints <= 0 → false`，isPadFun() 有 `<= 1 → false`，
    #   归零后两个都返回 false → isMobile = false → 工具栏回来。
    #
    # ★ 只在**非移动端 UA**上做：iPad / iPhone / Android 保持上游的移动端布局。
    #   不能对所有设备都归零 —— 那会连带禁用它们的触摸手势（平板上连触摸滚动都会失效）。
    #   也不用 `pointer: fine` 判断：实测有电脑在上报触摸的同时主指针并非 fine。
    #
    # ── ② 的根因 ────────────────────────────────────────────────────────
    # 上游 cell/index.tsx 给 luckysheet.create 传了 showstatisticBar: false，
    # 把「统计栏」整条藏了 —— 而缩放控件就在统计栏里。详见 fv-web-patch.js 头部注释。
    #
    # 验证：
    #   ① 打开 <域名>/app/basemetas-fileview/preview/debug，看 isMobile 是否变成 false
    #   ② 预览一个 xlsx，看底部是否出现缩放控件（浏览器控制台应有 [fv-patch] 日志）
    # 关掉：注释掉本 location 与下面那个 __fv-patch.js 的 location。
    # ⚠️ 都是改上游运行时的临时措施，上游修好后应删掉。
    #
    #   匹配 SPA 入口：/preview/view、/preview/welcome、/preview/debug 这类**不带扩展名**
    #   的路径，以及 /preview/index.html（万一上游是重定向到它而不是直接返回 HTML）。
    #   带扩展名的静态资源（.js/.css/图片）不在此列，走各自的 location。
    location ~ ^/app/basemetas-fileview/preview/(index\.html|[^.]*)$ {
        # 与主 location 保持一致：不因为是页面外壳就绕过逐用户权限闸门
        auth_request /__acl;

        # 应用中心点「打开」不带 ?path= → 转欢迎页（判定见上面的 $fv_view_needs_welcome）。
        # 必须放在 rewrite 之前：nginx 的 rewrite 阶段按配置顺序执行，return 会立即短路。
        # （nginx 的 if 里只有 return / rewrite…last 是安全的，这里用的是 return。）
        if ($fv_view_needs_welcome) {
            return 302 /app/basemetas-fileview/preview/welcome;
        }

        rewrite ^/app/basemetas-fileview/(.*)$ /$1 break;
        proxy_pass http://fileview:80;

        proxy_http_version 1.1;
        proxy_set_header Host $ext_authority;
        proxy_set_header X-Forwarded-Prefix /app/basemetas-fileview;

        proxy_buffering on;
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html;
        sub_filter_once on;
        # 注入两样东西：
        #   ① 内联的「让工具栏始终显示」修复（逻辑很短，保持内联）
        #   ② 外链的浏览器端补丁 fv-web-patch.js（触摸/缩放，逻辑长，单独放文件便于维护）
        # ⚠️ 外链必须用根绝对路径：页面在 /preview/xxx 下，相对路径会解析错。
        #
        # ① 说明（0.5.45）：上游 utils/device.ts 用 maxTouchPoints 判断 isPhoneFun()/isPadFun()，
        #    真机（华为 HarmonyOS NEXT 平板）上 isMobile=true → **工具栏整条不渲染**
        #    → PDF 无法旋转。所以**无条件**把它归零，让 isMobile=false、工具栏始终显示。
        #    ⚠️ 只归零 maxTouchPoints，**不动 ontouchstart** —— 用 ontouchstart 判断触摸的库不受影响。
        #    若发现平板上触摸手势失效：把下面 FORCE_DESKTOP 改成 false 即可退回旧行为
        #    （旧行为 = 只在非移动端 UA 上归零）。
        sub_filter '</head>' '<script>(function(){try{var FORCE_DESKTOP=true;var u=navigator.userAgent||"";var m=/iPad|iPhone|iPod|Android|Mobile|Tablet|Silk|Kindle/i.test(u)||(/Macintosh/i.test(u)&&navigator.maxTouchPoints>1);if(FORCE_DESKTOP||!m){Object.defineProperty(navigator,"maxTouchPoints",{get:function(){return 0},configurable:true})}}catch(e){}})();</script><script src="/app/basemetas-fileview/__fv-patch.js"></script></head>';
    }

    # 浏览器端补丁脚本本体。
    # 文件放在 app/docker/ 下，随 /etc/nginx/conf.d 一起挂进网关容器，所以这里 alias 过去即可。
    # 不加 auth_request：它只是静态 JS，且要在页面 <head> 里尽早同步加载。
    # Cache-Control 用 no-cache：升级后换了补丁内容能立刻生效，不会吃到旧缓存。
    location = /app/basemetas-fileview/__fv-patch.js {
        alias /etc/nginx/conf.d/fv-web-patch.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # ==========================================================================
    # CAD（DWG/DXF）—— **已彻底移出本应用**（0.5.58）
    # --------------------------------------------------------------------------
    # 原来这里有两处 location：
    #   ① 静态资源（alias 到 conf.d 下的 cad 目录）
    #   ② 读原文件字节（proxy 到闸门的 raw 端点）
    # 两者连同 app/docker 下的 cad 资源、闸门的 raw 端点**一起删掉了**。
    #
    # 为什么：CAD 已经做成**独立的飞牛应用**「CAD 查看器」（fnos-cadviewer），
    # 本应用再内置一份 cad-viewer + 字体 + WASM 就是把同一套东西打两遍
    # （字体 54 MB + WASM 9.5 MB ×2），而且两份会各自漂版本。
    # 现在本应用**不再注册 dwg/dxf**，打开图纸请装独立应用：
    #     https://github.com/bug-yu/fnos-cadviewer
    #
    # ⚠️ 注意：闸门的 raw 端点是「把文件字节交出去」的能力（比「放行/拒绝」更强），
    #    既然唯一的使用者（CAD 页）没了，就一并删掉，少一个攻击面 ✓
    # ⚠️ 本节刻意**不写出那两条 location 的完整路径** —— 否则 grep 会把它当成
    #    "CAD 还在"（自检里就有基于 grep 的反向断言）。
    # ==========================================================================

    location ~ ^/app/basemetas-fileview/preview/.+\.(js|mjs)$ {
        rewrite ^/app/basemetas-fileview/(.*)$ /$1 break;
        proxy_pass http://fileview:80;

        proxy_http_version 1.1;
        proxy_set_header Host $ext_authority;
        proxy_set_header X-Forwarded-Prefix /app/basemetas-fileview;

        proxy_buffering on;
        proxy_set_header Accept-Encoding "";

        sub_filter_types application/javascript text/javascript;
        sub_filter_once off;
        sub_filter 'credentials:"omit"' 'credentials:"same-origin"';
        sub_filter "credentials:'omit'" "credentials:'same-origin'";
    }

    location / {
        return 404;
    }
}
