# 飞牛统一网关 → FileView 的适配层
#
# 作用：
#   1. 监听 ${TRIM_APPDEST}/app.sock，接收飞牛统一网关校验登录态后转发的请求
#   2. 剥掉 /app/basemetas-fileview 前缀，转发给 FileView
#   3. 推导外部访问地址并写进 Host 头（FileView 靠它拼绝对预览地址）
#
# ⚠️ 为什么要自己推导：
#   飞牛统一网关走 unix socket 转发，**不带外部端口**。
#   而 FileView 用请求的 Host 头拼绝对地址（它不读 X-Forwarded-Host/Port，
#   只额外读 X-Forwarded-Prefix 和 X-Forwarded-Proto）。
#   端口一丢，生成出来的地址就少了 :8443/:5666，浏览器按 80/443 请求打不到 NAS，
#   表现为「页面能开、欢迎页正常，但每个文件都预览失败」。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------- 推导外部访问地址 ----------------
#
# 端口来源优先级（越高越可信）：
#   1. 网关透传的 X-Forwarded-Host 里带的端口
#   2. 请求 Host 头里的端口
#   3. Referer 里的端口 —— 但**必须与本次请求同源**（见下面的同源检查）
#   4. 都拿不到就「不加端口」，让浏览器走协议默认端口（80/443）
#
# ⚠️ 第 3 条为什么必须加同源检查（2026-09-26 从实测日志里抓到的真 bug）：
#   飞牛「自定义 URL」在非局域网模式下会用你填的外部地址打开应用，
#   而这个跳转的 Referer 可能是你之前用**内网地址**打开的那个页面。于是：
#       主机名取自 Host / X-Forwarded-Host → nas.example.com
#       端口  取自内网页的 Referer        → 5666
#   两者一拼就成了 nas.example.com:5666 —— 一个根本不存在的地址。
#   实测日志实例（修复前）：
#     diag in_host=nas.example.com out_host=nas.example.com:5666 proto=https ...
#   修法：**端口与主机名必须来自同一个来源**，Referer 只在与本请求同源时采信。

# 主机名：优先用网关透传的，其次用本请求 Host，最后去掉可能带的端口
map $http_x_forwarded_host $ext_hostname {
    default          $http_x_forwarded_host;
    ""               $host;
    "~^([^:]+):\d+$" $1;
}

map $http_x_forwarded_host $port_from_xh {
    default          "";
    "~^[^:]+:(\d+)$" $1;
}
map $http_host $port_from_host {
    default          "";
    "~^[^:]+:(\d+)$" $1;
}

# --- Referer：先取出端口和主机名，再判断是否与本次请求同源 ---
map $http_referer $port_from_ref_raw {
    default                   "";
    "~^https?://[^/]+:(\d+)/" $1;
}
map $http_referer $ref_host {
    default               "";
    "~^https?://([^/:]+)" $1;
}
# Referer 主机名 == 本请求主机名 → 1（同源），否则 0
# 键用逗号拼接，逗号在正则里不是元字符，避免额外的转义风险
map "$ref_host,$ext_hostname" $referer_same_host {
    default    0;
    "~^(.+),\1$" 1;
}
# 只有同源的 Referer 端口才采信
map "$port_from_ref_raw,$referer_same_host" $port_from_ref {
    default      "";
    "~^(\d+),1$" $port_from_ref_raw;
}

map "$port_from_xh:$port_from_host:$port_from_ref" $ext_port {
    default    "";
    "~^\d+:"   $port_from_xh;
    "~^:\d+:"  $port_from_host;
    "~^::\d+$" $port_from_ref;
}

# Host 头取值：有端口就带上，没端口就不带（不能写成 "host:" 带个空尾巴）
map $ext_port $ext_authority {
    default "$ext_hostname:$ext_port";
    ""      "$ext_hostname";
}

# 协议：优先用网关透传的，其次看 Referer
map $http_referer $proto_from_ref {
    default      "http";
    "~^https://" "https";
}
map $http_x_forwarded_proto $ext_proto {
    default $http_x_forwarded_proto;
    ""      $proto_from_ref;
}

# 诊断日志：docker logs basemetas-fileview-gateway 可看到推导结果
# ref_host / same 两列用来判断 Referer 是不是被同源检查挡掉了
log_format fvdiag 'diag in_host=$http_host ref_host=$ref_host same=$referer_same_host out_host=$ext_authority proto=$ext_proto uri=$request_uri';
access_log /var/log/nginx/access.log fvdiag;

#
# ============ 可选：固定兜底端口（默认关闭，按需启用）============
#
# 场景：首次导航既无 Referer、Host 与 X-Forwarded-Host 也都不带端口时，
#       会推导成「不加端口」（走 443/80）。若你的外部访问端口不是 443，
#       这一次导航的地址就会偏。启用下面的规则可给它一个兜底。
#
# 代价（务必想清楚再开）：
#   · 兜底值写死 → 以后你换外部端口，要回来同步改这一行；
#   · 若你真的用标准端口 443 从域名访问，会被错误地加上 :8443。
#   · 纯内网访问不受影响（规则只对非内网主机名生效）。
#
# 启用方法：去掉下面 4 段的注释，并把 8443 改成你的外部端口。
#
# map $ext_hostname $is_lan_host {
#     default                                                    0;
#     "~^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|127\.)"      1;
# }
# map "$ext_port,$is_lan_host" $ext_port_final {
#     default  "$ext_port";
#     ",0"     "8443";
# }
# （启用后，把上面 `map $ext_port $ext_authority` 的键改成 $ext_port_final）
#

server {
    listen unix:/app/target/app.sock;
    server_name _;

    autoindex off;

    # 网关前缀根路径 → FileView 欢迎页（子目录部署下欢迎页在 /preview/welcome）
    location = /app/basemetas-fileview {
        return 302 /app/basemetas-fileview/preview/welcome;
    }

    location = /app/basemetas-fileview/ {
        return 302 /app/basemetas-fileview/preview/welcome;
    }

    # FileView 子目录部署：proxy_pass 结尾带 /，剥掉前缀
    location /app/basemetas-fileview/ {
        proxy_pass http://fileview:80/;

        proxy_http_version 1.1;

        # ★★★ 核心一行：FileView 拼「绝对预览地址」用的是请求的 Host 头。
        #     飞牛网关转发的 Host 不带端口，必须在这里补上。
        proxy_set_header Host $ext_authority;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 这两个 FileView 会读
        proxy_set_header X-Forwarded-Proto $ext_proto;
        proxy_set_header X-Forwarded-Prefix /app/basemetas-fileview;

        # 这个 FileView 目前不读，但换应用时可能用得上，顺手给上
        proxy_set_header X-Forwarded-Host $ext_authority;
        proxy_set_header X-Forwarded-Port $ext_port;

        # 大图纸 / 大 PDF 转换耗时较长，放宽超时并关闭缓冲
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 2048m;

        # Excel / CSV 的凭据改写放在下面独立的 JS location 里（本 location 缓冲已关，
        # 与 sub_filter 不兼容）。

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ================= Excel / CSV 兜底：改写前端唯一一处 credentials:'omit' =================
    #
    # 现象：Word / PPT / PDF / DWG 都正常，只有 xls / xlsx / csv 无限转圈、且没有任何提示。
    #
    # 根因（2026-09-26 从前端源码定位，不是推测）：
    #   FileView 前端取文件字节时，**只有 Excel/CSV 这个渲染器**写了
    #       fetch(url, { credentials: 'omit' })
    #   源码 src/components/render/cell/index.tsx；全仓库检索 `credentials` **仅此一处**。
    #   其余渲染器都不带该选项 —— PDF 用 <iframe>、DWG 交给 @x-viewer 库自己取，
    #   所以都会正常带上同源 Cookie。
    #
    #   而在飞牛统一网关模式下，文件请求要过网关、靠登录会话（Cookie）鉴权。
    #   凭据一被 omit，网关认不出用户 → 浏览器拿不到文件字节 → 前端解析失败；
    #   又因为该渲染器**没有传 error 回调**，加载遮罩永远不会隐藏
    #   → 界面无限转圈（控制台也不一定有报错）。
    #
    # 处理：把这一处改写回浏览器默认的同源行为（same-origin → 带上 Cookie）。
    #
    # 为什么单独一个 location：
    #   1) sub_filter 只能改未压缩内容，所以要向上游声明 Accept-Encoding 为空；
    #   2) sub_filter 需要响应经过缓冲，而主 location 为流式传大图纸/大 PDF 关掉了缓冲
    #      （proxy_buffering off），两者不能共存，因此只对 .js 放开缓冲。
    #   3) 正则 location 下无法自动剥离前缀，所以用 rewrite ... break 显式剥掉。
    #
    # 代价：前端 JS 以未压缩形式传输（首屏多几百 KB）。内网无感，公网首屏略慢。
    #       注意 FileView 只对文本类（js/html/json）压缩，图纸、PDF 等本来就不压缩，
    #       所以不受影响。
    #
    # 想关掉：整段注释或删除即可。上游修好（不再 omit 凭据）后也应删掉本段。
    #
    # ⚠️ 依赖 nginx 的 sub 模块（官方 nginx:alpine 镜像已内置）。应用前可先自查：
    #    docker exec basemetas-fileview-gateway nginx -V 2>&1 | grep -o with-http_sub_module
    location ~ ^/app/basemetas-fileview/preview/.+\.(js|mjs)$ {
        rewrite ^/app/basemetas-fileview/(.*)$ /$1 break;
        proxy_pass http://fileview:80;

        proxy_http_version 1.1;
        proxy_set_header Host $ext_authority;
        proxy_set_header X-Forwarded-Prefix /app/basemetas-fileview;

        proxy_buffering on;
        proxy_set_header Accept-Encoding "";

        sub_filter_types application/javascript text/javascript;
        sub_filter_once off;
        sub_filter 'credentials:"omit"' 'credentials:"same-origin"';
        sub_filter "credentials:'omit'" "credentials:'same-origin'";
    }

    location / {
        return 404;
    }
}
